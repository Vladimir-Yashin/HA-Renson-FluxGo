name: Create release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version and create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -er '.version | strings | select(length > 0)' \
            custom_components/renson_fluxgo/manifest.json)

          gh release create "v${VERSION}" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION}" \
            --generate-notes
